version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: topicosfloricultura
      POSTGRES_USER: topicosfloricultura
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: quarkus-app
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://db:5432/topicosfloricultura
      - QUARKUS_DATASOURCE_USERNAME=topicosfloricultura
      - QUARKUS_DATASOURCE_PASSWORD=123456
      - QUARKUS_SWAGGER_UI_ALWAYS_INCLUDE=true
      - QUARKUS_SMALLRYE_OPENAPI_ENABLE=true
    volumes:
      - ./logs:/logs
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data: